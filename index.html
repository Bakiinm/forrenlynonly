<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Renlyn music app</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: white;
}

/* LOGIN */
#loginPage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: 9999;
}
input {
    padding: 10px;
    margin: 5px;
    width: 220px;
    border-radius: 6px;
    border: none;
}

button {
    padding: 10px 15px;
    border: none;
    background: #1db954;
    color: white;
    cursor: pointer;
    border-radius: 20px;
    margin-top: 10px;
}

/* APP */
#app {
    display: none;
    height: 100vh;
    width: 100vw;
    flex-direction: row;
}
/* SIDEBAR */
.sidebar {
    width: 25%;
    background: #000;
    padding: 20px;
}

.song {
    padding: 10px;
    margin: 8px 0;
    background: #181818;
    border-radius: 8px;
    cursor: pointer;
}

.song:hover {
    background: #282828;
}

/* MAIN */
.main {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

/* LOGO */
.logo {
    text-align: center;
    margin-top: 10px;
}

.logo img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 3px solid #1db954;
    box-shadow: 0 0 25px rgba(29,185,84,0.6);
    object-fit: cover;
}

/* MESSAGE BOX */
.messageBox {
    flex: 1;
    margin-top: 15px;
    background: #181818;
    padding: 15px;
    border-radius: 10px;
    overflow-y: auto;
    white-space: pre-line;
    line-height: 1.6;
}

/* AUDIO */
audio {
    width: 100%;
    margin-top: 10px;
}
    html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <h2>Login</h2>
    <input id="sisig" placeholder="What is the food that i made for you?">
    <input id="june 9" type="password" placeholder="My birthday ex: january 1">
    <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>Playlist for my cutierenren♥️</h3>

        <div class="song" onclick="playSong(0)">Song 1</div>
        <div class="song" onclick="playSong(1)">Song 2</div>
        <div class="song" onclick="playSong(2)">Song 3</div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- LOGO -->
        <div class="logo">
            <img id="songLogo" src="logo1.png">
        </div>

        <!-- TITLE + PLAYER -->
        <div>
            <h2 id="songTitle">Select a song</h2>
            <audio id="audio" controls></audio>
        </div>

        <!-- LONG MESSAGE AREA -->
        <div class="messageBox" id="messageBox">
            Your long message will appear here...
        </div>

    </div>
</div>

<script>
const songs = [
    {

        logo: "1.jpeg",
        message: `Since you came into my life, I honestly didn’t expect anything to change in me

    },
    {
        title: "YK by Cean jr.",
        src: "YK.mp3",
        logo: "2.jpeg",
        message: `We talked… and slowly, things became comfortable between us. I didn’t expect anything at first. I was still healing from my past, and honestly, I thought I already lost that part of me that knows how to love or care deeply again.

    },
    {

        message: `I’ve been listening to “Can I Be Him” by James Arthur, and honestly… it feels like the closest thing to what I want to say to you.

    }
];

function login() {
    let u = document.getElementById("sisig").value;
    let p = document.getElementById("june 9").value;

    if (u && p) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "flex";
    } else {
        alert("Please enter username and password");
    }
}

function playSong(i) {
    document.getElementById("songTitle").innerText = songs[i].title;
    document.getElementById("audio").src = songs[i].src;
    document.getElementById("songLogo").src = songs[i].logo;
    document.getElementById("messageBox").innerText = songs[i].message;
    document.getElementById("audio").play();
}
</script>

</body>
</html>
